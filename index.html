<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div class="greeting">
    <div class="container">

        <div class="paper">
            <img src="paper.png" class="paper-img">
            <h1 id="typing"></h1>
        </div>

        <img src="polaroid.png" class="polaroid">

    </div>
</div>
<div class="section2">
    <div class="container2">

        <div class="calendar">
            <img src="calendar.png" class="calendar-img">
        </div>

        <div class="text-side">
            <h1 id="typing2"></h1>

            <div class="numbers">
                <img src="2.png" class="num num2">
                <img src="3.png" class="num num3">
            </div>
        </div>

    </div>
</div>  
<div class="section3">
    
    <h1 id="cakeText" class="cake-text"></h1>

    <div class="cake-wrapper" id="cakeWrapper">
        <img src="cake.png" class="cake-img" id="cake">
    </div>

    <p class="blow-text">Blow into your microphone to blow out the candles 💨</p>
</div>

<div class="section4">

    <div class="flower-side">
        <img src="flowers.png" class="flower">
    </div>

    <div class="letter-side">
        <div class="letter">
            <h1>My Letter to You </h1>
            <p id="letterTyping"></p>
        </div>
    </div>

</div>

<script src="script.js"></script>
<audio id="bgMusic" loop>
    <source src="onlyexception.mp3" type="audio/mpeg">
</audio>
</body>
</html>
